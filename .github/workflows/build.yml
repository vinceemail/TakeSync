name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install FFmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install application and build dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build self-contained app
        run: python tools/build.py
      - name: Archive Mac app preserving symlinks
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/TakeSync.app dist/TakeSync-macOS-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: TakeSync-macOS-${{ runner.arch }}
          path: dist/TakeSync-macOS-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TakeSync-Windows
          path: dist/TakeSync/
