name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      apple_silicon_only:
        description: Build only the Apple Silicon app
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.apple_silicon_only && '["macos-latest"]' || '["windows-latest","macos-latest","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install FFmpeg (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install application and build dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build self-contained app
        run: python tools/build.py
      - name: Exercise frozen Mac app before archiving
        if: runner.os == 'macOS'
        run: python tools/smoke_bundle.py dist/TakeSync.app/Contents/MacOS/TakeSync
      - name: Archive Mac app preserving symlinks
        if: always() && runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/TakeSync.app dist/TakeSync-macOS-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: TakeSync-macOS-${{ runner.arch }}
          path: dist/TakeSync-macOS-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TakeSync-Windows
          path: dist/TakeSync/
