name: Validate Mac bundles

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Desktop build run ID containing Mac artifacts
        required: true
      apple_silicon_only:
        description: Validate only the Apple Silicon artifact
        type: boolean
        default: false
      publish_apple_silicon:
        description: Publish a downloadable preview after successful validation
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.apple_silicon_only && '["macos-latest"]' || '["macos-latest","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: TakeSync-macOS-${{ runner.arch }}
          path: downloaded
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - run: ditto -x -k downloaded/TakeSync-macOS-${{ runner.arch }}.zip extracted
      - run: brew install ffmpeg
      - run: python -m pip install numpy==2.2.6
      - name: Run frozen app with a system-only PATH and fresh cache
        run: python tools/smoke_bundle.py extracted/TakeSync.app/Contents/MacOS/TakeSync
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-validation-${{ runner.arch }}
          path: bundle-smoke/
  publish:
    needs: smoke
    if: inputs.publish_apple_silicon
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TakeSync-macOS-ARM64
          path: downloaded
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - name: Publish tested Apple Silicon preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp downloaded/TakeSync-macOS-ARM64.zip TakeSync-0.1.0-macOS-AppleSilicon.zip
          gh release create v0.1.0-mac-preview TakeSync-0.1.0-macOS-AppleSilicon.zip --prerelease --title "TakeSync 0.1.0 — Mac preview" --notes-file MAC_PREVIEW.md --target "$(git rev-parse HEAD)"
